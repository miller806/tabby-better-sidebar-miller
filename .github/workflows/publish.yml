name: Build and publish
on:
  push:
  pull_request:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:workspace-tabs
      - run: npm run lint:i18n
      - run: npm run build:prod
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: tabby-better-sidebar-miller-*.tgz
  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node -e "if (process.env.RELEASE_TAG !== 'v' + require('./package.json').version) process.exit(1)"
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
      - name: Check registry for an already published version
        id: registry
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "tabby-better-sidebar-miller@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.registry.outputs.published == 'false'
        run: npm publish tabby-better-sidebar-miller-*.tgz --access public --provenance
